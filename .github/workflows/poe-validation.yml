name: POE validation
on:
  push:
    branches: [v0/sql-dashboard, feature/poe-board, feature/poe-v5, fix/poe-navigation-conflict, feature/poe-visibility-refresh, fix/poe-current-year-default, feature/poe-annual-eac-chart, fix/poe-chart-selected-year, fix/poe-fixed-axis-static-controls, fix/poe-forecast-all-months, feature/poe-eac-selector-percent]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all Python
        run: python -m compileall -q app.py eac_board.py poe_board.py scripts tests
      - name: Run all regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
